[workspace]
resolver = "3"
members = [
    "crates/slilic-api",
    "crates/slilic-loader",
    "crates/slilic-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"
repository = "https://github.com/SlianElinovjano/Slilic"
homepage = "https://github.com/SlianElinovjano/Slilic"

[workspace.dependencies]
libloading = "0.8"
thiserror = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
