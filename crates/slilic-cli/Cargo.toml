[[bin]]
name = "slilic"
path = "src/main.rs"

[dependencies]
slilic-api = { path = "../slilic-api", version = "0.1.0" }
slilic-loader = { path = "../slilic-loader", version = "0.1.0" }
thiserror.workspace = true
